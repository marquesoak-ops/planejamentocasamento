function renderCostVisuals(){
 const items=state.costs.map((c,i)=>({...c,_i:i,_value:num(c.estimate)})).filter(c=>c._value>0);
 const total=items.reduce((a,c)=>a+c._value,0);
 const palette=['#74795a','#b5a47e','#9c775b','#c7b9a1','#59634d','#d5c9b6','#8f9b7a','#a88e79','#d7b7a3','#6d7c79','#b8a2a0','#c5ad70','#8b8068','#a8b6a0','#79695b','#d9c6a7','#8994a5','#bd8e70','#9a9d76','#c1b5c9','#8d7768','#b5bda6'];
 const cx=180,cy=180,r=148; let angle=-Math.PI/2;
 const slices=items.map((c,i)=>{const frac=c._value/total;const next=angle+frac*Math.PI*2;let d;if(frac>=.999999){d=`M ${cx} ${cy-r} A ${r} ${r} 0 1 1 ${cx} ${cy+r} A ${r} ${r} 0 1 1 ${cx} ${cy-r} Z`;}else{const x1=cx+r*Math.cos(angle),y1=cy+r*Math.sin(angle),x2=cx+r*Math.cos(next),y2=cy+r*Math.sin(next);d=`M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${frac>.5?1:0} 1 ${x2} ${y2} Z`;}const pct=frac*100;angle=next;return `<path class="pie-slice" tabindex="0" role="img" aria-label="${esc(c.item||'Item sem nome')}, categoria ${esc(c.category||'A classificar')}, ${money(c._value)}, ${pct.toLocaleString('pt-BR',{maximumFractionDigits:2})}%" data-pie-slice="1" data-item="${esc(c.item||'Item sem nome')}" data-category="${esc(c.category||'A classificar')}" data-amount="${esc(money(c._value))}" data-percent="${pct.toLocaleString('pt-BR',{maximumFractionDigits:2})}%" fill="${palette[i%palette.length]}" d="${d}"/>`});
 return `<div class="card chart-card pie-card"><div class="eyebrow">Composição do orçamento estimado</div><h3>Participação de cada item nos custos</h3><p class="small muted">Cada fatia representa um item com valor estimado informado. Passe o mouse ou selecione uma fatia para ver o item, a categoria, o valor e o percentual do total.</p>${items.length?`<div class="pie-summary"><span>Total estimado</span><strong>${money(total)}</strong><small>${items.length} ${items.length===1?'item com valor':'itens com valor'}</small></div><div class="pie-chart-wrap"><svg class="cost-pie" viewBox="0 0 360 360" role="group" aria-label="Gráfico de pizza interativo com a participação percentual de cada item">${slices.join('')}</svg></div><div class="pie-tooltip" id="pieTooltip" role="status" aria-live="polite" hidden></div><p class="pie-hint">Passe o mouse sobre uma fatia · clique ou use Tab para selecionar</p>`:'<div class="empty">Adicione valores estimados aos itens para visualizar a composição dos custos.</div>'}</div>`
}
function renderRiskMatrix(){const risks=[{name:'Espaço ainda não confirmado',p:3,i:3,action:'Solicitar proposta formal, regras, capacidade e política de cancelamento.'},{name:'Cerimônia e documentação sem validação',p:2,i:3,action:'Confirmar prazos e requisitos com a Catedral e o cartório.'},{name:'Estimativas sobrepostas a cotações',p:3,i:2,action:'Vincular cada cotação ao item correspondente.'},{name:'Fluxo de caixa incompleto',p:3,i:3,action:'Cadastrar recursos, parcelas e vencimentos confirmados.'},{name:'Plano de chuva indefinido',p:2,i:3,action:'Validar área coberta, tenda, energia e custo de contingência.'},{name:'Lista sem confirmações',p:3,i:2,action:'Definir calendário de envio e confirmação de presença.'}];
 const cells=[]; for(let impact=3;impact>=1;impact--){for(let prob=1;prob<=3;prob++){const items=risks.filter(r=>r.p===prob&&r.i===impact);const level=prob*impact;cells.push(`<div class="risk-cell risk-${level>=6?'high':level>=3?'med':'low'}"><span class="risk-cell-label">${impact===3?'Alto impacto':impact===2?'Impacto médio':'Baixo impacto'} · ${prob===3?'Alta':prob===2?'Média':'Baixa'} prob.</span>${items.map(r=>`<div class="risk-chip"><strong>${esc(r.name)}</strong></div>`).join('')||'<span class="risk-empty">Sem risco mapeado</span>'}</div>`)}}
 return `<div class="card matrix-card"><div class="eyebrow">Probabilidade × impacto</div><h3>Matriz visual de riscos</h3><p class="small muted">Classificação inicial sugerida para priorização. Revise probabilidade e impacto conforme novas informações; não é uma avaliação técnica definitiva.</p><div class="matrix-layout"><div class="matrix-y">IMPACTO</div><div class="matrix-grid">${cells.join('')}</div></div><div class="matrix-x">PROBABILIDADE → Baixa · Média · Alta</div><div class="risk-legend"><span><i class="risk-dot low"></i>Monitorar</span><span><i class="risk-dot med"></i>Mitigar</span><span><i class="risk-dot high"></i>Prioridade alta</span></div></div>`
}

function eventTimestamp(){
 const d=state.settings.eventDate||EVENT_DATE, t=state.settings.ceremonyTime||'16:30';
 // Horário oficial do evento: Brasília (UTC−03:00), sem depender do fuso do dispositivo.
 return new Date(`${d}T${t}:00-03:00`).getTime();
}
function updateCountdown(){
 const ids=['cdDays','cdHours','cdMinutes','cdSeconds'];
 if(!document.getElementById(ids[0]))return;
 const diff=eventTimestamp()-Date.now();
 const headline=document.getElementById('countdownHeadline');
 if(diff<=0){
  ids.forEach(id=>{const el=document.getElementById(id);if(el)el.textContent='00';});
  if(headline)headline.textContent=diff> -86400000?'O grande dia chegou.':'Uma memória para sempre.';
  return;
 }
 const sec=Math.floor(diff/1000), vals=[Math.floor(sec/86400),Math.floor(sec%86400/3600),Math.floor(sec%3600/60),sec%60];
 ids.forEach((id,i)=>{const el=document.getElementById(id);if(el)el.textContent=String(vals[i]).padStart(i===0?3:2,'0');});
 if(headline)headline.textContent='Cada detalhe nos conduz até lá.';
}

function field(label,name,value='',type='text',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value??'')}" ${extra}></div>`}
function textareaField(label,name,value=''){return `<div class="field span2"><label>${label}</label><textarea name="${name}">${esc(value??'')}</textarea></div>`}
function selectField(label,name,value,opts){return `<div class="field"><label>${label}</label><select name="${name}">${opts.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
function formWrap(fields,submit){return `<form id="editForm">${fields}<div class="actions"><button type="button" onclick="closeModal()">Cancelar</button><button class="primary" type="submit">Salvar registro</button></div></form>`}
function openQuickAdd(){openModal('Novo registro',`<div class="grid two">${[['Fornecedor','add-vendor'],['Convidado','add-guest'],['Tarefa / pendência','add-task'],['Custo','add-cost'],['Atividade do dia','add-timeline'],['Item visual','add-design'],['Pagamento','add-payment'],['Nota / decisão','add-note']].map(x=>`<button onclick="closeModal();actions('${x[1]}')">${x[0]} ＋</button>`).join('')}</div>`)}
function actions(action,id){
 const i=id==null?null:Number(id);
 if(action==='add-vendor'||action==='edit-vendor'){const q=i==null?{service:'',supplier:'',contact:'',notes:'',quote:'',deposit:'',installments:'',due:'',paid:0,status:'A verificar'}:{...state.quotes[i]};openModal(i==null?'Adicionar fornecedor':'Editar fornecedor',formWrap(`<div class="form-grid">${field('Serviço / produto','service',q.service)}${field('Fornecedor','supplier',q.supplier)}${field('Contato','contact',q.contact)}${field('Valor cotado (R$)','quote',q.quote??'','number','step="0.01" min="0"')}${field('Entrada (R$)','deposit',q.deposit??'','number','step="0.01" min="0"')}${field('Valor já pago (R$)','paid',q.paid??0,'number','step="0.01" min="0"')}${field('Data de pagamento / vencimento','due',q.due||'','date')}${field('Condições de parcelamento','installments',q.installments)}${selectField('Status','status',q.status,statusOptions)}${textareaField('Itens incluídos / observações','notes',q.notes)}</div>`,null));document.getElementById('editForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),obj={};for(const [k,v] of f)obj[k]=v;obj.quote=obj.quote===''?null:num(obj.quote);obj.deposit=obj.deposit===''?null:num(obj.deposit);obj.paid=num(obj.paid);if(i==null)state.quotes.push(obj);else state.quotes[i]=obj;save();closeModal();render()};return}
 if(action==='add-guest'||action==='edit-guest'){const g=i==null?{name:'',family:'',category:'',side:'Ana',notes:'',role:'',attendance:'Pendente',children:0}:{...state.guests[i]};openModal(i==null?'Adicionar convidado':'Editar convidado',formWrap(`<div class="form-grid">${field('Nome','name',g.name)}${field('Grupo / família','family',g.family)}${field('Categoria','category',g.category)}${selectField('Lado','side',g.side||'Ana',['Ana','João','Ambos','A definir'])}${selectField('Presença','attendance',g.attendance||'Pendente',['Pendente','Confirmado','Recusado'])}${field('Quantidade de crianças','children',g.children||0,'number','min="0" step="1"')}${field('Papel / função','role',g.role)}${textareaField('Observações','notes',g.notes)}</div>`));document.getElementById('editForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),obj={};for(const [k,v] of f)obj[k]=v;obj.children=num(obj.children);if(i==null)state.guests.push(obj);else state.guests[i]=obj;save();closeModal();render()};return}
 if(action==='add-task'||action==='edit-task'){const t=i==null?{title:'',category:'',priority:'Média',due:'',status:'A verificar',owner:'A definir',next:''}:{...state.tasks[i]};openModal(i==null?'Nova tarefa / pendência':'Editar tarefa',formWrap(`<div class="form-grid">${field('Tarefa','title',t.title)}${field('Categoria','category',t.category)}${selectField('Prioridade','priority',t.priority||'Média',['Crítica','Alta','Média','Baixa'])}${field('Prazo sugerido','due',t.due||'','date')}${field('Responsável','owner',t.owner)}${selectField('Status','status',t.status||'A verificar',['A verificar','Em andamento','Aguardando retorno','Concluído','Cancelado'])}${textareaField('Próxima ação','next',t.next)}</div>`));document.getElementById('editForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),obj={};for(const [k,v] of f)obj[k]=v;if(i==null)state.tasks.push(obj);else state.tasks[i]=obj;save();closeModal();render()};return}
 if(action==='add-cost'||action==='edit-cost'){const c=i==null?{category:'A classificar',item:'',qty:'',unit:'',estimate:'',status:'A verificar'}:{...state.costs[i]};openModal(i==null?'Adicionar custo':'Editar custo',formWrap(`<div class="form-grid">${field('Categoria','category',c.category)}${field('Item','item',c.item)}${field('Quantidade','qty',c.qty??'','number','step="any"')}${field('Valor unitário (R$)','unit',c.unit??'','number','step="0.01" min="0"')}${field('Estimativa total (R$)','estimate',c.estimate??'','number','step="0.01" min="0"')}${selectField('Status','status',c.status||'A verificar',['A verificar','Estimado','Cotado','Confirmado'])}</div>`));document.getElementById('editForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),obj={};for(const [k,v] of f)obj[k]=['qty','unit','estimate'].includes(k)?(v===''?null:num(v)):v;if(i==null)state.costs.push(obj);else state.costs[i]=obj;save();closeModal();render()};return}
 if(action==='add-timeline'||action==='edit-timeline'){const t=i==null?{time:'',end:'',title:'',place:'A definir',owner:'A definir',status:'Sugestão'}:{...state.timeline[i]};openModal(i==null?'Adicionar atividade':'Editar atividade',formWrap(`<div class="form-grid">${field('Atividade','title',t.title)}${field('Horário inicial','time',t.time,'time')}${field('Horário final','end',t.end,'time')}${field('Local','place',t.place)}${field('Responsável','owner',t.owner)}${selectField('Status','status',t.status||'Sugestão',['Sugestão','A verificar','Confirmado','Concluído'])}</div>`));document.getElementById('editForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),obj={};for(const [k,v] of f)obj[k]=v;if(i==null)state.timeline.push(obj);else state.timeline[i]=obj;save();closeModal();render()};return}
 if(action==='add-payment'){const p={date:new Date().toISOString().slice(0,10),description:'',amount:'',method:'',notes:''};openModal('Registrar pagamento',formWrap(`<div class="form-grid">${field('Data','date',p.date,'date')}${field('Descrição','description')}${field('Valor (R$)','amount','','number','step="0.01" min="0"')}${field('Forma de pagamento','method')}${textareaField('Observações','notes')}</div>`));document.getElementById('editForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),obj={};for(const [k,v] of f)obj[k]=v;obj.amount=num(obj.amount);state.payments.push(obj);save();closeModal();render()};return}
 if(action==='delete-payment'){if(confirm('Excluir este registro de pagamento?')){state.payments.splice(i,1);save();render()}return}
 if(action==='add-note'){openModal('Nova nota / decisão',formWrap(`<div class="form-grid">${field('Título','title')}${field('Data','date',new Date().toISOString().slice(0,10),'date')}${textareaField('Nota / decisão','body')}</div>`));document.getElementById('editForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),obj={};for(const [k,v] of f)obj[k]=v;state.notes.push(obj);save();closeModal();render()};return}
 if(action==='delete-note'){if(confirm('Excluir esta nota?')){state.notes.splice(i,1);save();render()}return}
 if(action==='add-design'||action==='edit-design'){state.designItems=state.designItems||[{name:'Convite e envelope',ref:'Marfim + verde-oliva; papel texturizado',supplier:'',budget:null,status:'A verificar'},{name:'Menu e marcador de mesa',ref:'Tipografia editorial e detalhes dourados',supplier:'',budget:null,status:'A verificar'},{name:'Arranjos florais',ref:'Verdes naturais e flores em tons suaves',supplier:'',budget:null,status:'A verificar'},{name:'Mesa posta',ref:'Louças claras, linho e dourado fosco',supplier:'',budget:null,status:'A verificar'},{name:'Buquê e lapelas',ref:'Botânico e atemporal',supplier:'',budget:null,status:'A verificar'},{name:'Sinalização e painel',ref:'Monograma AJ e linhas discretas',supplier:'',budget:null,status:'A verificar'}];const d=i==null?{name:'',ref:'',supplier:'',budget:'',status:'A verificar'}:{...state.designItems[i]};openModal(i==null?'Novo item visual':'Editar item visual',formWrap(`<div class="form-grid">${field('Elemento','name',d.name)}${field('Fornecedor','supplier',d.supplier)}${field('Orçamento (R$)','budget',d.budget??'','number','step="0.01" min="0"')}${selectField('Status','status',d.status||'A verificar',statusOptions)}${textareaField('Referência / acabamento','ref',d.ref)}</div>`));document.getElementById('editForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),obj={};for(const [k,v] of f)obj[k]=k==='budget'?(v===''?null:num(v)):v;if(i==null)state.designItems.push(obj);else state.designItems[i]=obj;save();closeModal();render()};return}
 if(action==='delete-task'){if(confirm('Excluir esta tarefa do planejamento?')){state.tasks.splice(i,1);save();render()}return}
 if(action==='delete-vendor'){if(confirm('Excluir este fornecedor/cotação? Esta ação não pode ser desfeita sem backup.')){state.quotes.splice(i,1);save();render()}return}
 if(action==='delete-guest'){if(confirm('Excluir este convidado da lista?')){state.guests.splice(i,1);save();render()}return}
 if(action==='delete-cost'){if(confirm('Excluir este item de custo?')){state.costs.splice(i,1);save();render()}return}

}
function exportBackup(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString(),schemaVersion:1},null,2)],{type:'application/json'});downloadBlob(blob,'backup_casamento_ana_julia_joao_vitor.json')}
function restoreBackup(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(!obj||!Array.isArray(obj.guests)||!Array.isArray(obj.quotes))throw new Error('Formato de backup inválido');if(!confirm('Restaurar este backup? Os dados atuais serão substituídos.'))return;state=obj;save();render();alert('Backup restaurado.')}catch(e){alert('Não foi possível restaurar: '+e.message)}finally{event.target.value=''}};reader.readAsText(file)}
function exportCSV(type){let rows=[],name='dados.csv';if(type==='guests'){name='convidados.csv';rows=[['Nome','Família/grupo','Categoria','Lado','Observações','Papel','Presença','Crianças'],...state.guests.map(g=>[g.name,g.family,g.category,g.side,g.notes,g.role,g.attendance,g.children])]}else if(type==='quotes'){name='fornecedores.csv';rows=[['Serviço','Fornecedor','Contato','Cotação','Entrada','Pago','Data','Parcelamento','Status','Observações'],...state.quotes.map(q=>[q.service,q.supplier,q.contact,q.quote,q.deposit,q.paid,q.due,q.installments,q.status,q.notes])]}else{ name='custos.csv';rows=[['Categoria','Item','Quantidade','Valor unitário','Estimativa','Status'],...state.costs.map(c=>[c.category,c.item,c.qty,c.unit,c.estimate,c.status])]};const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');downloadBlob(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),name)}
function downloadBlob(blob,name){const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function bindPageFilters(){if(page==='guests')renderGuestsTable();if(page==='vendors')renderVendorTable();if(page==='planning')renderTaskTable()}
document.addEventListener('input',e=>{if(e.target.matches('[data-filter]'))bindPageFilters()});
document.addEventListener('change',e=>{if(e.target.matches('[data-filter]'))bindPageFilters()});

// Filtros por coluna inspirados no Excel: ordenação, pesquisa e seleção de valores.
let excelMenu=null, excelState={};
function excelCellValue(cell){const control=cell.querySelector('select,input');return control?String(control.value??'').trim():String(cell.innerText||'').replace(/\s+/g,' ').trim()}
function excelCompare(a,b){const clean=x=>String(x).replace(/[R$%\s.]/g,'').replace(',','.');const na=Number(clean(a)),nb=Number(clean(b));if(String(a).match(/\d{2}\/\d{2}\/\d{4}/)&&String(b).match(/\d{2}\/\d{2}\/\d{4}/)){const parse=x=>{const [d,m,y]=x.split('/');return +`${y}${m}${d}`};return parse(a)-parse(b)}if(String(a).trim()!==''&&String(b).trim()!==''&&Number.isFinite(na)&&Number.isFinite(nb))return na-nb;return String(a).localeCompare(String(b),'pt-BR',{numeric:true,sensitivity:'base'})}
function enhanceTables(){document.querySelectorAll('#app table').forEach((table,ti)=>{if(!table.dataset.excelId)table.dataset.excelId='excel-table-'+ti+'-'+Math.random().toString(36).slice(2,7);const head=table.tHead?.rows[0];if(!head)return;[...head.cells].forEach((th,ci)=>{if(th.querySelector('.excel-filter-btn'))return;const btn=document.createElement('button');btn.type='button';btn.className='excel-filter-btn';btn.title='Ordenar e filtrar esta coluna';btn.setAttribute('aria-label','Ordenar e filtrar '+th.innerText);btn.textContent='▼';btn.addEventListener('click',e=>{e.stopPropagation();openExcelMenu(table,th,ci,btn)});th.appendChild(btn)})})}
function closeExcelMenu(){if(excelMenu){excelMenu.remove();excelMenu=null}}
function applyExcelFilters(table){const prefix=table.dataset.excelId+'|';const filters=Object.entries(excelState).filter(([k,v])=>k.startsWith(prefix)&&v.values);const body=table.tBodies[0];if(!body)return;[...body.rows].forEach(row=>{row.style.display=filters.every(([k,v])=>{const col=Number(k.slice(prefix.length));return v.values.includes(excelCellValue(row.cells[col]||document.createElement('td')))} )?'':'none'})}
function openExcelMenu(table,th,col,btn){closeExcelMenu();const body=table.tBodies[0];if(!body)return;const rows=[...body.rows];const values=[...new Set(rows.map(r=>excelCellValue(r.cells[col]||document.createElement('td'))))].sort((a,b)=>a.localeCompare(b,'pt-BR',{numeric:true,sensitivity:'base'}));const key=table.dataset.excelId+'|'+col;const chosen=excelState[key]?.values?new Set(excelState[key].values):new Set(values);const menu=document.createElement('div');menu.className='excel-filter-menu';menu.innerHTML=`<div class="menu-title">Ordenar e filtrar · ${th.innerText.replace('▼','').trim()}</div><button class="sort-action" data-sort="asc">↑ Classificar de A a Z / menor para maior</button><button class="sort-action" data-sort="desc">↓ Classificar de Z a A / maior para menor</button><button class="sort-action" data-sort="clear">Limpar ordenação e filtros</button><input type="search" placeholder="Pesquisar valores..."><div class="value-list"></div><div class="menu-actions"><button data-apply>Aplicar filtro</button><button data-cancel>Fechar</button></div>`;document.body.appendChild(menu);excelMenu=menu;const rect=btn.getBoundingClientRect();menu.style.left=Math.max(8,Math.min(rect.left,innerWidth-258))+'px';menu.style.top=Math.min(rect.bottom+4,innerHeight-365)+'px';const list=menu.querySelector('.value-list');function fill(search=''){list.innerHTML='';const filtered=values.filter(v=>v.toLocaleLowerCase('pt-BR').includes(search.toLocaleLowerCase('pt-BR')));const all=document.createElement('label');all.innerHTML='<input type="checkbox" data-all> (Selecionar tudo)';all.querySelector('input').checked=filtered.every(v=>chosen.has(v));list.appendChild(all);all.querySelector('input').addEventListener('change',e=>{filtered.forEach(v=>e.target.checked?chosen.add(v):chosen.delete(v));fill(menu.querySelector('input[type=search]').value)});filtered.forEach(v=>{const lab=document.createElement('label'),cb=document.createElement('input');cb.type='checkbox';cb.checked=chosen.has(v);lab.append(cb,document.createTextNode(v||'(vazio)'));cb.addEventListener('change',()=>cb.checked?chosen.add(v):chosen.delete(v));list.appendChild(lab)})}fill();menu.querySelector('input[type=search]').addEventListener('input',e=>fill(e.target.value));menu.querySelectorAll('[data-sort]').forEach(b=>b.addEventListener('click',()=>{const mode=b.dataset.sort;if(mode==='clear'){delete excelState[key];applyExcelFilters(table);th.querySelector('.excel-filter-btn')?.classList.remove('active')}else{const sorted=[...body.rows].sort((a,b)=>excelCompare(excelCellValue(a.cells[col]||document.createElement('td')),excelCellValue(b.cells[col]||document.createElement('td')))*(mode==='asc'?1:-1));sorted.forEach(r=>body.appendChild(r));excelState[key]=excelState[key]||{};excelState[key].sort=mode}closeExcelMenu();}));menu.querySelector('[data-apply]').addEventListener('click',()=>{excelState[key]=excelState[key]||{};excelState[key].values=[...chosen];btn.classList.toggle('active',chosen.size<values.length);applyExcelFilters(table);closeExcelMenu()});menu.querySelector('[data-cancel]').addEventListener('click',closeExcelMenu)}
document.addEventListener('click',e=>{if(excelMenu&&!excelMenu.contains(e.target)&&!e.target.closest('.excel-filter-btn'))closeExcelMenu()});

function boot(){if(!state.settings)state.settings={};if(!state.tasks)state.tasks=defaultTasks;if(!state.timeline)state.timeline=defaultTimeline;save();render()}
boot();
updateCountdown();setInterval(updateCountdown,1000);
</script>
